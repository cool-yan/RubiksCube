<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原生逻辑魔方打乱与计时器</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #2a2a2a;
            --text: #f0f0f0;
            --accent: #4caf50;
        }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; width: 100%; justify-content: center; }
        .panel { background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #fff; }
        
        /* 计时器与打乱区 */
        .scramble-box { text-align: center; font-size: 24px; letter-spacing: 2px; margin-bottom: 20px; font-weight: bold; color: #ffeb3b; min-height: 35px;}
        .timer-display { font-size: 80px; font-family: monospace; text-align: center; margin: 20px 0; cursor: pointer; user-select: none; }
        .timer-display.inspection { color: #f44336; }
        
        /* 视图区 */
        .view-container { display: flex; gap: 20px; justify-content: center; align-items: flex-start; }
        canvas { background: #222; border-radius: 8px; }
        
        /* 控制按钮 */
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        button { background: #444; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #555; }
        button.primary { background: var(--accent); }
        button.primary:hover { background: #45a049; }
        
        /* 设置与记录 */
        .settings-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; margin-bottom: 15px; }
        input[type="color"] { border: none; width: 30px; height: 30px; cursor: pointer; background: none; }
        select, input[type="number"] { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        
        .records-list { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 14px; }
        .record-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #444; }
        .delete-btn { color: #ff4c4c; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

<div class="scramble-box" id="scrambleText">R U R' U' ...</div>

<div class="container">
    <!-- 主交互区 -->
    <div class="panel" style="flex: 2; min-width: 300px;">
        <div class="timer-display" id="timeDisplay">0.000</div>
        <p style="text-align: center; color: #aaa; font-size: 14px;">长按空格/点击时间开始 15 秒倒计时，松开开始计时，再按停止</p>
        
        <div class="view-container">
            <div>
                <h3 style="font-size: 16px; text-align: center;">2D 展开图</h3>
                <canvas id="canvas2D" width="240" height="180"></canvas>
            </div>
            <div>
                <h3 style="font-size: 16px; text-align: center;">伪 3D 跟做视图</h3>
                <canvas id="canvas3D" width="200" height="180"></canvas>
            </div>
        </div>

        <div class="controls">
            <button onclick="playStep(-1)">◀ 上一步</button>
            <button onclick="toggleAutoPlay()" id="playBtn">▶ 自动播放还原</button>
            <button onclick="playStep(1)">下一步 ▶</button>
        </div>
        <p style="text-align: center; font-size: 12px; color: #888;">当前还原步骤: <span id="solveStepText">准备中</span></p>
    </div>

    <!-- 侧边栏：设置与数据 -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 250px;">
        <div class="panel">
            <h3>偏好设置</h3>
            <div class="settings-grid">
                <label>打乱步数:</label>
                <select id="scrambleLength" onchange="generateNew()">
                    <option value="15">15 步</option>
                    <option value="20" selected>20 步</option>
                    <option value="25">25 步</option>
                </select>
                <label>配色 (U,D,F,B,L,R):</label>
                <div style="display:flex; gap:2px;">
                    <input type="color" id="colU" value="#ffffff" onchange="updateColors()">
                    <input type="color" id="colD" value="#ffff00" onchange="updateColors()">
                    <input type="color" id="colF" value="#00ff00" onchange="updateColors()">
                    <input type="color" id="colB" value="#0000ff" onchange="updateColors()">
                    <input type="color" id="colL" value="#ffa500" onchange="updateColors()">
                    <input type="color" id="colR" value="#ff0000" onchange="updateColors()">
                </div>
            </div>
            <button class="primary" style="width: 100%;" onclick="generateNew()">生成新打乱</button>
        </div>

        <div class="panel">
            <h3>成绩记录</h3>
            <div style="font-size: 14px; margin-bottom: 10px;">
                PB: <span id="pbText" style="color:var(--accent); font-weight:bold;">--</span> | 
                Ao5: <span id="ao5Text">--</span><br>
                总计: <span id="totalCount">0</span> 次
            </div>
            <div class="records-list" id="recordsList"></div>
            <button style="width: 100%; margin-top: 10px; background: #5a2a2a;" onclick="clearRecords()">清空记录</button>
        </div>
    </div>
</div>

<script>
/**
 * 核心逻辑层：使用单维数组模拟 6 面 * 9 贴纸 = 54 个状态位
 * 面索引映射: U:0, R:1, F:2, D:3, L:4, B:5
 */
const FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
let currentScramble = [];
let solveSteps = [];
let solveIndex = 0;
let cubeState = new Array(54).fill(0);
let colors = ['#ffffff', '#ff0000', '#00ff00', '#ffff00', '#ffa500', '#0000ff'];

// 颜色绑定
function updateColors() {
    colors = [
        document.getElementById('colU').value,
        document.getElementById('colR').value,
        document.getElementById('colF').value,
        document.getElementById('colD').value,
        document.getElementById('colL').value,
        document.getElementById('colB').value
    ];
    render2D();
    render3D();
}

// 核心：魔方旋转算法 (90度顺时针)
// 这个循环映射非常考验数据结构的精确度
function rotateFace(face) {
    const f = face * 9;
    // 面上的 8 个贴纸顺时针循环
    const temp = [cubeState[f], cubeState[f+1], cubeState[f+2], cubeState[f+5], cubeState[f+8], cubeState[f+7], cubeState[f+6], cubeState[f+3]];
    cubeState[f] = temp[6]; cubeState[f+1] = temp[7]; cubeState[f+2] = temp[0];
    cubeState[f+5] = temp[1]; cubeState[f+8] = temp[2]; cubeState[f+7] = temp[3];
    cubeState[f+6] = temp[4]; cubeState[f+3] = temp[5];

    // 邻边循环映射
    const adj = {
        0: [[4,0,1,2], [5,0,1,2], [1,0,1,2], [2,0,1,2]], // U
        1: [[0,8,5,2], [2,8,5,2], [3,8,5,2], [5,0,3,6]], // R
        2: [[0,6,7,8], [1,0,3,6], [3,2,1,0], [4,8,5,2]], // F
        3: [[2,6,7,8], [1,6,7,8], [5,6,7,8], [4,6,7,8]], // D
        4: [[0,0,3,6], [2,0,3,6], [3,0,3,6], [5,8,5,2]], // L
        5: [[0,2,1,0], [4,0,3,6], [3,6,7,8], [1,8,5,2]]  // B
    }[face];

    let edgeTemp = [cubeState[adj[0][0]*9 + adj[0][1]], cubeState[adj[0][0]*9 + adj[0][2]], cubeState[adj[0][0]*9 + adj[0][3]]];
    for (let i = 0; i < 3; i++) {
        cubeState[adj[0][0]*9 + adj[0][i+1]] = cubeState[adj[3][0]*9 + adj[3][i+1]];
        cubeState[adj[3][0]*9 + adj[3][i+1]] = cubeState[adj[2][0]*9 + adj[2][i+1]];
        cubeState[adj[2][0]*9 + adj[2][i+1]] = cubeState[adj[1][0]*9 + adj[1][i+1]];
        cubeState[adj[1][0]*9 + adj[1][i+1]] = edgeTemp[i];
    }
}

function doMove(moveStr) {
    const faceStr = moveStr[0];
    const modifier = moveStr[1] || '';
    const faceIdx = FACES.indexOf(faceStr);
    let turns = modifier === "'" ? 3 : (modifier === "2" ? 2 : 1);
    for(let i=0; i<turns; i++) rotateFace(faceIdx);
}

// 还原逻辑（直接取逆向公式作为新手"最速跟做"）
function getInverseMove(move) {
    if (move.includes("'")) return move[0];
    if (move.includes("2")) return move;
    return move + "'";
}

// WCA 打乱生成器
function generateScramble(length) {
    const moves = [];
    const modifiers = ["", "'", "2"];
    let lastFace = -1;
    let secLastFace = -1;
    
    for (let i = 0; i < length; i++) {
        let face;
        do {
            face = Math.floor(Math.random() * 6);
        // 避免同面连续（如 R R），避免同轴往复（如 R L R）
        } while (face === lastFace || (Math.floor(face / 2) === Math.floor(lastFace / 2) && face === secLastFace));
        
        secLastFace = lastFace;
        lastFace = face;
        moves.push(FACES[face] + modifiers[Math.floor(Math.random() * 3)]);
    }
    return moves;
}

function resetCube() {
    for(let i=0; i<54; i++) cubeState[i] = Math.floor(i/9);
}

function generateNew() {
    const len = parseInt(document.getElementById('scrambleLength').value);
    currentScramble = generateScramble(len);
    document.getElementById('scrambleText').innerText = currentScramble.join(" ");
    
    resetCube();
    currentScramble.forEach(doMove);
    
    // 生成逆序还原步骤
    solveSteps = [...currentScramble].reverse().map(getInverseMove);
    solveIndex = 0;
    updateSolveText();
    
    render2D();
    render3D();
}

/**
 * UI 与 渲染层
 */
const ctx2D = document.getElementById('canvas2D').getContext('2d');
const ctx3D = document.getElementById('canvas3D').getContext('2d');

function drawFace2D(ctx, faceIdx, offsetX, offsetY, size) {
    const f = faceIdx * 9;
    const s = size / 3;
    for(let i=0; i<9; i++) {
        let r = Math.floor(i / 3), c = i % 3;
        ctx.fillStyle = colors[cubeState[f + i]];
        ctx.fillRect(offsetX + c*s, offsetY + r*s, s-1, s-1);
    }
}

function render2D() {
    ctx2D.clearRect(0, 0, 240, 180);
    const s = 45; 
    // 经典十字网格排布 U:0, L:4, F:2, R:1, B:5, D:3
    drawFace2D(ctx2D, 0, s, 0, s);    // U
    drawFace2D(ctx2D, 4, 0, s, s);    // L
    drawFace2D(ctx2D, 2, s, s, s);    // F
    drawFace2D(ctx2D, 1, s*2, s, s);  // R
    drawFace2D(ctx2D, 5, s*3, s, s);  // B
    drawFace2D(ctx2D, 3, s, s*2, s);  // D
}

// 纯 Canvas 伪 3D 渲染 (等距视角投影)
function render3D() {
    ctx3D.clearRect(0, 0, 200, 180);
    ctx3D.save();
    ctx3D.translate(100, 40); // 视角中心
    const s = 30; // 贴纸基准大小

    // 画 U 面 (倾斜与旋转)
    ctx3D.save();
    ctx3D.transform(1, 0.5, -1, 0.5, 0, 0);
    for(let i=0; i<9; i++) {
        let r = Math.floor(i/3), c = i%3;
        ctx3D.fillStyle = colors[cubeState[0*9 + i]];
        ctx3D.fillRect(c*s, r*s, s-1.5, s-1.5);
    }
    ctx3D.restore();

    // 画 F 面
    ctx3D.save();
    ctx3D.translate(-s*3, s*1.5);
    ctx3D.transform(1, -0.5, 0, 1, 0, 0);
    for(let i=0; i<9; i++) {
        let r = Math.floor(i/3), c = i%3;
        ctx3D.fillStyle = colors[cubeState[2*9 + i]];
        ctx3D.fillRect(c*s, r*s, s-1.5, s-1.5);
    }
    ctx3D.restore();

    // 画 R 面
    ctx3D.save();
    ctx3D.translate(0, s*1.5);
    ctx3D.transform(1, 0.5, 0, 1, 0, 0);
    for(let i=0; i<9; i++) {
        let r = Math.floor(i/3), c = i%3;
        ctx3D.fillStyle = colors[cubeState[1*9 + i]];
        ctx3D.fillRect(c*s, r*s, s-1.5, s-1.5);
    }
    ctx3D.restore();
    
    ctx3D.restore();
}

/**
 * 播放器逻辑
 */
let autoPlayInterval = null;

function updateSolveText() {
    let t = solveSteps.map((s, i) => i === solveIndex ? `<span style="color:var(--accent); font-weight:bold;">${s}</span>` : s).join(" ");
    if(solveIndex >= solveSteps.length) t += " (已还原)";
    document.getElementById('solveStepText').innerHTML = t;
}

function playStep(dir) {
    if(dir === 1 && solveIndex < solveSteps.length) {
        doMove(solveSteps[solveIndex]);
        solveIndex++;
    } else if (dir === -1 && solveIndex > 0) {
        solveIndex--;
        doMove(getInverseMove(solveSteps[solveIndex])); // 回退是做逆向的逆向
    }
    updateSolveText();
    render2D();
    render3D();
    
    if(solveIndex >= solveSteps.length && autoPlayInterval) toggleAutoPlay();
}

function toggleAutoPlay() {
    const btn = document.getElementById('playBtn');
    if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        btn.innerText = "▶ 自动播放还原";
    } else {
        if(solveIndex >= solveSteps.length) return; // 已经拼好
        btn.innerText = "⏸ 暂停";
        autoPlayInterval = setInterval(() => playStep(1), 800);
    }
}

/**
 * 计时器与数据持久化逻辑 (Cookie)
 */
let timerState = 'IDLE'; // IDLE, INSPECT, RUNNING
let startTime = 0;
let inspectTime = 0;
let timerInterval = null;
let records = [];

function getCookies() {
    const match = document.cookie.match(new RegExp('(^| )rubikRecords=([^;]+)'));
    if (match) records = JSON.parse(decodeURIComponent(match[2]));
    updateRecordsUI();
}

function saveCookies() {
    document.cookie = `rubikRecords=${encodeURIComponent(JSON.stringify(records))}; path=/; max-age=31536000`; // 保存1年
    updateRecordsUI();
}

function formatTime(ms) {
    return (ms / 1000).toFixed(3);
}

function updateRecordsUI() {
    const list = document.getElementById('recordsList');
    list.innerHTML = '';
    
    if (records.length === 0) {
        document.getElementById('pbText').innerText = "--";
        document.getElementById('ao5Text').innerText = "--";
        document.getElementById('totalCount').innerText = "0";
        return;
    }

    let pb = Math.min(...records);
    document.getElementById('pbText').innerText = formatTime(pb);
    document.getElementById('totalCount').innerText = records.length;
    
    // 计算 Ao5（去掉一个最高分，一个最低分）
    if(records.length >= 5) {
        let last5 = records.slice(0, 5).sort((a,b)=>a-b);
        let ao5 = (last5[1] + last5[2] + last5[3]) / 3;
        document.getElementById('ao5Text').innerText = formatTime(ao5);
    } else {
        document.getElementById('ao5Text').innerText = "--";
    }

    records.forEach((rec, idx) => {
        let div = document.createElement('div');
        div.className = 'record-item';
        div.innerHTML = `<span>${records.length - idx}. ${formatTime(rec)}s</span>
                         <span class="delete-btn" onclick="deleteRecord(${idx})">x</span>`;
        list.appendChild(div);
    });
}

function deleteRecord(idx) {
    records.splice(idx, 1);
    saveCookies();
}

function clearRecords() {
    if(confirm("确定要清空所有历史成绩吗？")) {
        records = [];
        saveCookies();
    }
}

// 计时器主函数
function startInspection() {
    if(timerState !== 'IDLE') return;
    timerState = 'INSPECT';
    inspectTime = 15;
    document.getElementById('timeDisplay').innerText = inspectTime;
    document.getElementById('timeDisplay').classList.add('inspection');
    
    timerInterval = setInterval(() => {
        inspectTime--;
        if(inspectTime > 0) {
            document.getElementById('timeDisplay').innerText = inspectTime;
        } else {
            // 倒计时结束，自动开始计时
            startTimer();
        }
    }, 1000);
}

function startTimer() {
    if(timerState === 'RUNNING') return;
    clearInterval(timerInterval);
    timerState = 'RUNNING';
    startTime = performance.now();
    document.getElementById('timeDisplay').classList.remove('inspection');
    
    timerInterval = setInterval(() => {
        document.getElementById('timeDisplay').innerText = formatTime(performance.now() - startTime);
    }, 10);
}

function stopTimer() {
    if(timerState !== 'RUNNING') return;
    clearInterval(timerInterval);
    timerState = 'IDLE';
    let finalTime = performance.now() - startTime;
    document.getElementById('timeDisplay').innerText = formatTime(finalTime);
    
    // 保存成绩并自动打乱下一个
    records.unshift(finalTime);
    saveCookies();
    generateNew();
}

// 事件监听：处理空格与触屏
function handleInputDown(e) {
    if (e.code === 'Space' || e.type === 'touchstart' || e.type === 'mousedown') {
        if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return; // 防止冲突
        if (timerState === 'IDLE') startInspection();
        else if (timerState === 'RUNNING') stopTimer();
    }
}

function handleInputUp(e) {
    if (e.code === 'Space' || e.type === 'touchend' || e.type === 'mouseup') {
        if (timerState === 'INSPECT') startTimer();
    }
}

window.addEventListener('keydown', (e) => { if(e.code==='Space') e.preventDefault(); handleInputDown(e); });
window.addEventListener('keyup', handleInputUp);

const timeDisp = document.getElementById('timeDisplay');
timeDisp.addEventListener('mousedown', handleInputDown);
timeDisp.addEventListener('mouseup', handleInputUp);
timeDisp.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputDown(e); });
timeDisp.addEventListener('touchend', handleInputUp);

// 初始化
updateColors();
getCookies();
generateNew();

</script>
</body>
</html>
