<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原生真3D魔方打乱与计时器</title>
    <style>
        :root { --bg: #1a1a1a; --panel: #2a2a2a; --text: #f0f0f0; --accent: #4caf50; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; width: 100%; justify-content: center; }
        .panel { background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #fff; text-align: center; font-size: 16px;}
        
        /* 计时器与打乱区 */
        .scramble-box { text-align: center; font-size: 24px; letter-spacing: 2px; margin-bottom: 20px; font-weight: bold; color: #ffeb3b; min-height: 35px;}
        .timer-display { font-size: 80px; font-family: monospace; text-align: center; margin: 10px 0; cursor: pointer; user-select: none; }
        .timer-display.inspection { color: #f44336; }
        
        /* 视图区 */
        .view-container { display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
        canvas { background: #222; border-radius: 8px; }
        #container3D { width: 260px; height: 260px; background: #222; border-radius: 8px; cursor: grab; position: relative; }
        #container3D:active { cursor: grabbing; }
        .hint { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 12px; color: #888; pointer-events: none; }
        
        /* 控制按钮 */
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        button { background: #444; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #555; }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }
        button.primary { background: var(--accent); }
        button.primary:hover { background: #45a049; }
        
        /* 设置与记录 */
        .settings-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; margin-bottom: 15px; }
        input[type="color"] { border: none; width: 30px; height: 30px; cursor: pointer; background: none; }
        select, input[type="number"] { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        
        .records-list { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 14px; }
        .record-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #444; }
        .delete-btn { color: #ff4c4c; cursor: pointer; margin-left: 10px; font-weight: bold; }
    </style>
    <!-- 引入 Three.js 与 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="scramble-box" id="scrambleText">加载中...</div>

<div class="container">
    <!-- 主交互区 -->
    <div class="panel" style="flex: 2; min-width: 320px;">
        <div class="timer-display" id="timeDisplay">0.000</div>
        <p style="text-align: center; color: #aaa; font-size: 14px; margin-top: -10px; margin-bottom: 20px;">按住空格/屏幕 15 秒倒计时，松开开始计时，再按停止</p>
        
        <div class="view-container">
            <div>
                <h3>真 3D 跟做视图</h3>
                <div id="container3D">
                    <div class="hint">按住鼠标可 360° 拖拽旋转</div>
                </div>
            </div>
            <div>
                <h3>2D 展开图 (校验)</h3>
                <canvas id="canvas2D" width="240" height="180" style="margin-top: 40px;"></canvas>
            </div>
        </div>

        <div class="controls">
            <button onclick="playStep(-1)" id="btnPrev">◀ 上一步</button>
            <button onclick="toggleAutoPlay()" id="btnPlay">▶ 自动播放</button>
            <button onclick="playStep(1)" id="btnNext">下一步 ▶</button>
        </div>
        <p style="text-align: center; font-size: 14px; color: #ccc;">还原步骤: <span id="solveStepText">准备中</span></p>
    </div>

    <!-- 侧边栏：设置与数据 -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 260px;">
        <div class="panel">
            <h3>偏好设置</h3>
            <div class="settings-grid">
                <label>打乱步数:</label>
                <select id="scrambleLength" onchange="generateNew()">
                    <option value="15">15 步</option>
                    <option value="20" selected>20 步</option>
                    <option value="25">25 步</option>
                </select>
                <label>配色自定义:</label>
                <div style="display:flex; gap:2px;">
                    <input type="color" id="colU" value="#ffffff" onchange="updateColors()" title="上(U)">
                    <input type="color" id="colD" value="#ffff00" onchange="updateColors()" title="下(D)">
                    <input type="color" id="colF" value="#00ff00" onchange="updateColors()" title="前(F)">
                    <input type="color" id="colB" value="#0000ff" onchange="updateColors()" title="后(B)">
                    <input type="color" id="colL" value="#ffa500" onchange="updateColors()" title="左(L)">
                    <input type="color" id="colR" value="#ff0000" onchange="updateColors()" title="右(R)">
                </div>
            </div>
            <button class="primary" style="width: 100%;" onclick="generateNew()">生成新打乱</button>
        </div>

        <div class="panel">
            <h3>成绩记录</h3>
            <div style="font-size: 14px; margin-bottom: 10px;">
                PB: <span id="pbText" style="color:var(--accent); font-weight:bold;">--</span> | 
                Ao5: <span id="ao5Text">--</span><br>
                总计: <span id="totalCount">0</span> 次
            </div>
            <div class="records-list" id="recordsList"></div>
            <button style="width: 100%; margin-top: 10px; background: #5a2a2a;" onclick="clearRecords()">清空记录</button>
        </div>
    </div>
</div>

<script>
/** -------------------------------------------------------------
 *  1. 底层核心算法层 (保持 2D 状态机做底层校验)
 *  ------------------------------------------------------------- */
const FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
let currentScramble = [], solveSteps = [], solveIndex = 0;
let cubeState = new Array(54).fill(0);
let colors = ['#ffffff', '#ff0000', '#00ff00', '#ffff00', '#ffa500', '#0000ff'];

// 颜色绑定 (顺带直接更新 3D 材质)
function updateColors() {
    colors = [
        document.getElementById('colU').value, document.getElementById('colR').value,
        document.getElementById('colF').value, document.getElementById('colD').value,
        document.getElementById('colL').value, document.getElementById('colB').value
    ];
    render2D();
    if (matDict) {
        matDict.U.color.set(colors[0]); matDict.R.color.set(colors[1]);
        matDict.F.color.set(colors[2]); matDict.D.color.set(colors[3]);
        matDict.L.color.set(colors[4]); matDict.B.color.set(colors[5]);
    }
}

// 精确的 2D 状态机旋转 (用来做逻辑兜底，防止 3D 浮点误差累积)
function rotateFace(face) {
    const f = face * 9;
    const temp = [cubeState[f], cubeState[f+1], cubeState[f+2], cubeState[f+5], cubeState[f+8], cubeState[f+7], cubeState[f+6], cubeState[f+3]];
    cubeState[f] = temp[6]; cubeState[f+1] = temp[7]; cubeState[f+2] = temp[0];
    cubeState[f+5] = temp[1]; cubeState[f+8] = temp[2]; cubeState[f+7] = temp[3];
    cubeState[f+6] = temp[4]; cubeState[f+3] = temp[5];
    const adj = {
        0: [[4,0,1,2], [5,0,1,2], [1,0,1,2], [2,0,1,2]], // U
        1: [[0,8,5,2], [2,8,5,2], [3,8,5,2], [5,0,3,6]], // R
        2: [[0,6,7,8], [1,0,3,6], [3,2,1,0], [4,8,5,2]], // F
        3: [[2,6,7,8], [1,6,7,8], [5,6,7,8], [4,6,7,8]], // D
        4: [[0,0,3,6], [2,0,3,6], [3,0,3,6], [5,8,5,2]], // L
        5: [[0,2,1,0], [4,0,3,6], [3,6,7,8], [1,8,5,2]]  // B
    }[face];
    let edgeTemp = [cubeState[adj[0][0]*9 + adj[0][1]], cubeState[adj[0][0]*9 + adj[0][2]], cubeState[adj[0][0]*9 + adj[0][3]]];
    for (let i = 0; i < 3; i++) {
        cubeState[adj[0][0]*9 + adj[0][i+1]] = cubeState[adj[3][0]*9 + adj[3][i+1]];
        cubeState[adj[3][0]*9 + adj[3][i+1]] = cubeState[adj[2][0]*9 + adj[2][i+1]];
        cubeState[adj[2][0]*9 + adj[2][i+1]] = cubeState[adj[1][0]*9 + adj[1][i+1]];
        cubeState[adj[1][0]*9 + adj[1][i+1]] = edgeTemp[i];
    }
}

function doMove2D(moveStr) {
    const faceStr = moveStr[0], modifier = moveStr[1] || '';
    const faceIdx = FACES.indexOf(faceStr);
    let turns = modifier === "'" ? 3 : (modifier === "2" ? 2 : 1);
    for(let i=0; i<turns; i++) rotateFace(faceIdx);
}

function getInverseMove(move) {
    if (move.includes("'")) return move[0];
    if (move.includes("2")) return move;
    return move + "'";
}

// 严谨的 WCA 规范打乱生成
function generateScramble(length) {
    const moves = [], modifiers = ["", "'", "2"];
    let lastFace = -1, secLastFace = -1;
    for (let i = 0; i < length; i++) {
        let face;
        do { face = Math.floor(Math.random() * 6); } 
        while (face === lastFace || (Math.floor(face / 2) === Math.floor(lastFace / 2) && face === secLastFace));
        secLastFace = lastFace; lastFace = face;
        moves.push(FACES[face] + modifiers[Math.floor(Math.random() * 3)]);
    }
    return moves;
}

/** -------------------------------------------------------------
 *  2. 渲染层 (2D + 真正 Three.js WebGL)
 *  ------------------------------------------------------------- */
const ctx2D = document.getElementById('canvas2D').getContext('2d');
function render2D() {
    ctx2D.clearRect(0, 0, 240, 180);
    const s = 45; 
    const drawF = (f, ox, oy) => {
        for(let i=0; i<9; i++) {
            ctx2D.fillStyle = colors[cubeState[f*9 + i]];
            ctx2D.fillRect(ox + (i%3)*s/3, oy + Math.floor(i/3)*s/3, s/3-1, s/3-1);
        }
    };
    drawF(0, s, 0);   drawF(4, 0, s);   drawF(2, s, s);
    drawF(1, s*2, s); drawF(5, s*3, s); drawF(3, s, s*2);
}

// --- Three.js 核心初始化 ---
let scene, camera, renderer, controls;
let cubies = [];
let pivot = new THREE.Group();
let matDict = null;

function init3D() {
    const container = document.getElementById('container3D');
    scene = new THREE.Scene();
    
    // 相机与 OrbitControls 配置 (允许拖拽)
    camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(4, 4, 6);
    
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(260, 260);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enablePan = false; controls.enableZoom = false; controls.enableDamping = true;

    // 材质映射字典
    matDict = {
        U: new THREE.MeshBasicMaterial({ color: colors[0] }),
        D: new THREE.MeshBasicMaterial({ color: colors[3] }),
        F: new THREE.MeshBasicMaterial({ color: colors[2] }),
        B: new THREE.MeshBasicMaterial({ color: colors[5] }),
        R: new THREE.MeshBasicMaterial({ color: colors[1] }),
        L: new THREE.MeshBasicMaterial({ color: colors[4] }),
        K: new THREE.MeshBasicMaterial({ color: 0x111111 }) // 内层纯黑
    };

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
}

// 重建绝对还原的 3D 魔方模型
function createCube3D() {
    cubies.forEach(c => scene.remove(c));
    cubies = [];
    const gap = 1.05; // 间距
    const geo = new THREE.BoxGeometry(1, 1, 1);
    
    for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
            for (let z = -1; z <= 1; z++) {
                // Three.js 材质数组顺序: +x(R), -x(L), +y(U), -y(D), +z(F), -z(B)
                let mats = [
                    x === 1 ? matDict.R : matDict.K, x === -1 ? matDict.L : matDict.K,
                    y === 1 ? matDict.U : matDict.K, y === -1 ? matDict.D : matDict.K,
                    z === 1 ? matDict.F : matDict.K, z === -1 ? matDict.B : matDict.K
                ];
                const mesh = new THREE.Mesh(geo, mats);
                // 加个黑色边框让 3D 效果更好看
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
                mesh.add(line);
                mesh.position.set(x * gap, y * gap, z * gap);
                scene.add(mesh);
                cubies.push(mesh);
            }
        }
    }
}

// 执行 3D 旋转核心运算 (支持立即完成或平滑动画)
let isAnimating = false;
function applyTurn3D(face, modifier, instant = false, onComplete = null) {
    if(isAnimating && !instant) return;
    if(!instant) isAnimating = true;

    // 旋转轴系与方向映射 (遵循右手螺旋定则)
    let axis = ['U','D'].includes(face) ? 'y' : (['R','L'].includes(face) ? 'x' : 'z');
    let sign = ['U','R','F'].includes(face) ? -1 : 1; 
    let turns = modifier === "'" ? -1 : (modifier === "2" ? 2 : 1);
    let targetAngle = sign * turns * (Math.PI / 2);

    // 动态抓取当前处于该层的 色块(Cubie)
    const activeCubies = [];
    const threshold = 0.5;
    cubies.forEach(c => {
        const pos = new THREE.Vector3();
        c.getWorldPosition(pos);
        if      (face === 'U' && pos.y > threshold) activeCubies.push(c);
        else if (face === 'D' && pos.y < -threshold) activeCubies.push(c);
        else if (face === 'R' && pos.x > threshold) activeCubies.push(c);
        else if (face === 'L' && pos.x < -threshold) activeCubies.push(c);
        else if (face === 'F' && pos.z > threshold) activeCubies.push(c);
        else if (face === 'B' && pos.z < -threshold) activeCubies.push(c);
    });

    // 将选中的色块挂载到 pivot (旋转中枢)
    scene.add(pivot);
    pivot.rotation.set(0,0,0);
    pivot.position.set(0,0,0);
    activeCubies.forEach(c => pivot.attach(c));

    if (instant) {
        pivot.rotation[axis] = targetAngle;
        pivot.updateMatrixWorld();
        activeCubies.forEach(c => scene.attach(c)); // 脱离中枢并保留世界矩阵变换
        if (onComplete) onComplete();
    } else {
        const duration = 250; 
        const start = performance.now();
        function tween() {
            let progress = (performance.now() - start) / duration;
            if (progress >= 1) {
                pivot.rotation[axis] = targetAngle;
                pivot.updateMatrixWorld();
                activeCubies.forEach(c => scene.attach(c));
                isAnimating = false;
                if(onComplete) onComplete();
            } else {
                // easeOut 平滑缓动效果
                const ease = 1 - Math.pow(1 - progress, 3);
                pivot.rotation[axis] = targetAngle * ease;
                requestAnimationFrame(tween);
            }
        }
        tween();
    }
}

/** -------------------------------------------------------------
 *  3. 播放器逻辑层 (包含自动播放队列与状态同步)
 *  ------------------------------------------------------------- */
let isAutoPlaying = false;

function updateSolveText() {
    let t = solveSteps.map((s, i) => i === solveIndex ? `<span style="color:var(--accent); font-weight:bold;">${s}</span>` : s).join(" ");
    if(solveIndex >= solveSteps.length) t += " (已还原)";
    document.getElementById('solveStepText').innerHTML = t;
}

function playStep(dir, autoCallback = null) {
    if(isAnimating) return;
    let move;
    
    if (dir === 1 && solveIndex < solveSteps.length) {
        move = solveSteps[solveIndex];
        doMove2D(move); // 2D 先行
        solveIndex++;
    } else if (dir === -1 && solveIndex > 0) {
        solveIndex--;
        move = getInverseMove(solveSteps[solveIndex]);
        doMove2D(move); // 退回等于执行逆公式
    } else {
        return;
    }
    
    updateSolveText();
    render2D();
    
    // 执行 3D 动画
    applyTurn3D(move[0], move[1] || '', false, autoCallback);
}

function toggleAutoPlay() {
    const btn = document.getElementById('btnPlay');
    if (isAutoPlaying) {
        isAutoPlaying = false;
        btn.innerText = "▶ 自动播放";
    } else {
        if(solveIndex >= solveSteps.length) return;
        isAutoPlaying = true;
        btn.innerText = "⏸ 暂停";
        playNextAuto();
    }
}

function playNextAuto() {
    if (!isAutoPlaying) return;
    if (solveIndex < solveSteps.length) {
        playStep(1, () => {
            if (isAutoPlaying) setTimeout(playNextAuto, 150); // 间隔一小会儿再播下一步
        });
    } else {
        toggleAutoPlay();
    }
}

function generateNew() {
    if (isAnimating) return;
    isAutoPlaying = false;
    document.getElementById('btnPlay').innerText = "▶ 自动播放";
    
    const len = parseInt(document.getElementById('scrambleLength').value);
    currentScramble = generateScramble(len);
    document.getElementById('scrambleText').innerText = currentScramble.join(" ");
    
    // 强制重置底层2D 与 3D模型（避免浮点误差累积）
    for(let i=0; i<54; i++) cubeState[i] = Math.floor(i/9);
    createCube3D();
    
    // 瞬间打乱 3D 和 2D
    currentScramble.forEach(move => {
        doMove2D(move);
        applyTurn3D(move[0], move[1] || '', true);
    });
    
    solveSteps = [...currentScramble].reverse().map(getInverseMove);
    solveIndex = 0;
    updateSolveText();
    render2D();
}

/** -------------------------------------------------------------
 *  4. 计时器与数据持久化逻辑 (Cookie)
 *  ------------------------------------------------------------- */
let timerState = 'IDLE', startTime = 0, inspectTime = 0, timerInterval = null, records = [];

function getCookies() {
    const match = document.cookie.match(new RegExp('(^| )rubikRecords=([^;]+)'));
    if (match) records = JSON.parse(decodeURIComponent(match[2]));
    updateRecordsUI();
}
function saveCookies() {
    document.cookie = `rubikRecords=${encodeURIComponent(JSON.stringify(records))}; path=/; max-age=31536000`;
    updateRecordsUI();
}
function formatTime(ms) { return (ms / 1000).toFixed(3); }

function updateRecordsUI() {
    const list = document.getElementById('recordsList');
    list.innerHTML = '';
    if (records.length === 0) {
        document.getElementById('pbText').innerText = "--"; document.getElementById('ao5Text').innerText = "--";
        document.getElementById('totalCount').innerText = "0"; return;
    }
    document.getElementById('pbText').innerText = formatTime(Math.min(...records));
    document.getElementById('totalCount').innerText = records.length;
    
    if(records.length >= 5) {
        let last5 = records.slice(0, 5).sort((a,b)=>a-b);
        document.getElementById('ao5Text').innerText = formatTime((last5[1] + last5[2] + last5[3]) / 3);
    } else document.getElementById('ao5Text').innerText = "--";

    records.forEach((rec, idx) => {
        let div = document.createElement('div'); div.className = 'record-item';
        div.innerHTML = `<span>${records.length - idx}. ${formatTime(rec)}s</span><span class="delete-btn" onclick="deleteRecord(${idx})">x</span>`;
        list.appendChild(div);
    });
}
function deleteRecord(idx) { records.splice(idx, 1); saveCookies(); }
function clearRecords() { if(confirm("确定要清空所有历史成绩吗？")) { records = []; saveCookies(); } }

function startInspection() {
    if(timerState !== 'IDLE') return;
    timerState = 'INSPECT'; inspectTime = 15;
    document.getElementById('timeDisplay').innerText = inspectTime;
    document.getElementById('timeDisplay').classList.add('inspection');
    
    timerInterval = setInterval(() => {
        inspectTime--;
        if(inspectTime > 0) document.getElementById('timeDisplay').innerText = inspectTime;
        else startTimer();
    }, 1000);
}

function startTimer() {
    if(timerState === 'RUNNING') return;
    clearInterval(timerInterval); timerState = 'RUNNING'; startTime = performance.now();
    document.getElementById('timeDisplay').classList.remove('inspection');
    timerInterval = setInterval(() => { document.getElementById('timeDisplay').innerText = formatTime(performance.now() - startTime); }, 10);
}

function stopTimer() {
    if(timerState !== 'RUNNING') return;
    clearInterval(timerInterval); timerState = 'IDLE';
    let finalTime = performance.now() - startTime;
    document.getElementById('timeDisplay').innerText = formatTime(finalTime);
    records.unshift(finalTime); saveCookies(); generateNew();
}

// 防止点击设置、按钮或 3D 视图时触发计时器
function isValidTimerTarget(e) {
    if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return false;
    if(e.target.closest && e.target.closest('#container3D')) return false; // 排除 3D 拖拽区
    return true;
}

function handleInputDown(e) {
    if (!isValidTimerTarget(e)) return;
    if (e.code === 'Space' || e.type === 'touchstart' || e.type === 'mousedown') {
        if (timerState === 'IDLE') startInspection();
        else if (timerState === 'RUNNING') stopTimer();
    }
}
function handleInputUp(e) {
    if (!isValidTimerTarget(e)) return;
    if (e.code === 'Space' || e.type === 'touchend' || e.type === 'mouseup') {
        if (timerState === 'INSPECT') startTimer();
    }
}

window.addEventListener('keydown', (e) => { if(e.code==='Space') { e.preventDefault(); handleInputDown(e); } });
window.addEventListener('keyup', handleInputUp);
const timeDisp = document.getElementById('timeDisplay');
timeDisp.addEventListener('mousedown', handleInputDown); timeDisp.addEventListener('mouseup', handleInputUp);
timeDisp.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputDown(e); });
timeDisp.addEventListener('touchend', handleInputUp);

// --- 初始化流 ---
init3D();
updateColors();
getCookies();
generateNew();

</script>
</body>
</html>
